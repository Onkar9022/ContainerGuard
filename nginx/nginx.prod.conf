events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # ContainerGuard Production Gateway — Reverse Proxy Architecture
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------------------
        # 1. Gateway Healthcheck Probe
        # ---------------------------------------------------------------------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # ---------------------------------------------------------------------
        # 2. Socket.IO / WebSocket Live Log Streaming
        # ---------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for persistent live log streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---------------------------------------------------------------------
        # 3. Backend REST API
        # ---------------------------------------------------------------------
        location /api/ {
            # Preserves /api/... URI path exactly when forwarding to backend
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for on-demand Trivy vulnerability scans and reports
            proxy_connect_timeout 60s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # ---------------------------------------------------------------------
        # 4. Frontend Single Page Application (SPA)
        # ---------------------------------------------------------------------
        location / {
            # Forwards all UI requests to frontend Nginx container
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
