name: ContainerGuard CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 461415799543.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: containerguard-backend
  FRONTEND_REPOSITORY: containerguard-frontend
  EC2_INSTANCE_ID: i-0196fe146e9708f8e
  FRONTEND_API_URL: http://3.110.108.85:5000

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::461415799543:role/ContainerGuardGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:${{ steps.image.outputs.tag }} \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest \
            ./BackEnd

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=$FRONTEND_API_URL \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ steps.image.outputs.tag }} \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest \
            ./FrontEnd

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:${{ steps.image.outputs.tag }}
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ steps.image.outputs.tag }}
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest

      - name: Deploy to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ContainerGuard $GITHUB_SHA" \
            --parameters 'commands=[
              "cd /home/ec2-user/containerguard",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 461415799543.dkr.ecr.ap-south-1.amazonaws.com",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID"
            exit 1
          fi

      - name: Verify deployment
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://3.110.108.85:5000/api/health