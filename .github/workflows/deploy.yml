name: ContainerGuard CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 461415799543.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: containerguard-backend
  FRONTEND_REPOSITORY: containerguard-frontend
  EC2_INSTANCE_ID: i-0196fe146e9708f8e
  # Frontend API URL (empty for production: uses same-origin relative /api and /socket.io via Nginx gateway)
  FRONTEND_API_URL: ""

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::461415799543:role/ContainerGuardGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------------
      # Immutable Image Tag: Full Git commit SHA
      # Production deployments MUST use this tag, never :latest
      # ---------------------------------------------------------------
      - name: Set immutable image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying commit SHA: ${IMAGE_TAG}"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.backend_image }} \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest \
            ./BackEnd

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL="$FRONTEND_API_URL" \
            -t ${{ steps.image.outputs.frontend_image }} \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest \
            ./FrontEnd

      - name: Push backend image
        run: |
          docker push ${{ steps.image.outputs.backend_image }}
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest

      - name: Push frontend image
        run: |
          docker push ${{ steps.image.outputs.frontend_image }}
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest

      # ---------------------------------------------------------------
      # Verify the exact SHA images exist in ECR before deploying.
      # Fail fast if the push did not succeed.
      # ---------------------------------------------------------------
      - name: Verify SHA images exist in ECR
        run: |
          echo "Verifying backend image exists in ECR..."
          aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids imageTag="${{ steps.image.outputs.tag }}" \
            --region "$AWS_REGION" > /dev/null

          echo "Verifying frontend image exists in ECR..."
          aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids imageTag="${{ steps.image.outputs.tag }}" \
            --region "$AWS_REGION" > /dev/null

          echo "✅ Both SHA images verified in ECR"

      - name: Deploy to EC2 using SSM
        run: |
          BACKEND_IMG="${{ steps.image.outputs.backend_image }}"
          FRONTEND_IMG="${{ steps.image.outputs.frontend_image }}"
          DEPLOY_SHA="${{ steps.image.outputs.tag }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ContainerGuard SHA: ${DEPLOY_SHA}" \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ec2-user/containerguard\",
              \"echo '--- Preparing deployment configuration ---'\",
              \"mkdir -p nginx\",
              \"echo 'Downloading docker-compose.prod.yml from commit ${DEPLOY_SHA}'\",
              \"curl -fsSL https://raw.githubusercontent.com/Onkar9022/ContainerGuard/${DEPLOY_SHA}/docker-compose.prod.yml -o docker-compose.prod.yml\",
              \"echo 'Downloading nginx.prod.conf from commit ${DEPLOY_SHA}'\",
              \"curl -fsSL https://raw.githubusercontent.com/Onkar9022/ContainerGuard/${DEPLOY_SHA}/nginx/nginx.prod.conf -o nginx/nginx.prod.conf\",
              \"echo '--- Validating production Compose configuration ---'\",
              \"docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet\",
              \"echo '--- ECR Login ---'\",
              \"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 461415799543.dkr.ecr.ap-south-1.amazonaws.com\",
              \"echo '--- Setting immutable image references ---'\",
              \"echo 'Deploying SHA: ${DEPLOY_SHA}'\",
              \"sed -i '/^BACKEND_IMAGE=/d' .env.prod 2>/dev/null || true\",
              \"sed -i '/^FRONTEND_IMAGE=/d' .env.prod 2>/dev/null || true\",
              \"echo 'BACKEND_IMAGE=${BACKEND_IMG}' >> .env.prod\",
              \"echo 'FRONTEND_IMAGE=${FRONTEND_IMG}' >> .env.prod\",
              \"echo '--- Pulling exact SHA images ---'\",
              \"docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend frontend\",
              \"echo '--- Starting services ---'\",
              \"docker compose -f docker-compose.prod.yml --env-file .env.prod up -d\",
              \"echo '--- Waiting for health checks ---'\",
              \"sleep 20\",
              \"echo '--- Container status ---'\",
              \"docker compose -f docker-compose.prod.yml --env-file .env.prod ps\",
              \"echo '--- Verifying deployed image SHA ---'\",
              \"docker inspect --format='{{.Config.Image}}' containerguard-prod-backend\",
              \"docker inspect --format='{{.Config.Image}}' containerguard-prod-frontend\",
              \"echo '--- Pruning old images ---'\",
              \"docker image prune -f\",
              \"echo '--- Deployment complete ---'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Deploying SHA: $DEPLOY_SHA"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID"
            exit 1
          fi

          echo "✅ Deployment succeeded for SHA: $DEPLOY_SHA"

      # ---------------------------------------------------------------
      # Verify the deployed application is healthy through Nginx gateway
      # ---------------------------------------------------------------
      - name: Verify deployment health
        run: |
          echo "--- Verifying /api/health ---"
          curl --fail --retry 5 --retry-delay 5 \
            http://3.110.108.85:8080/api/health

          echo ""
          echo "--- Verifying /healthz ---"
          curl --fail --retry 3 --retry-delay 5 \
            http://3.110.108.85:8080/healthz

          echo ""
          echo "✅ All health checks passed"